<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="site-nav">
      <a href="{{ '/articles/' | relative_url }}" class="revisit-nav-link">All articles</a>
      <a href="{{ '/revisit/' | relative_url }}" class="revisit-nav-link">Revisit list</a>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
  <script>
    window.READS_STATE_API = {{ site.state_api | jsonify }};
    window.READS_STATE_TOKEN = {{ site.state_token | jsonify }};
  </script>
  <script src="{{ '/assets/reading-state.js' | relative_url }}" defer></script>
</body>
</html>
