  <meta name="description" content="WHO WE ARE

🏔Product: TLDR exists to increase tech&#39;s signal-to-noise ratio. Where we&#39;re going: to be tech&#39;s intellectual Schelling point - where the future starts its day.

Today that means the largest network of tech newsletters in the world, with over 8M subscribers covering startups, software engineering, AI, cybersecurity, product, and more. What makes it work is who writes it. Every issue comes from people building in tech, not reporters covering it. Our writers keep their day jobs: two engineers at Coinbase write TLDR Crypto https://tldr.tech/crypto, engineers at DeepMind and Meta write TLDR Dev https://tldr.tech/dev, researchers at Anthropic and Adobe write TLDR AI https://tldr.tech/ai, and robotics and datacenter strategy leads at OpenAI and Meta write TLDR Hardware https://tldr.tech/hardware.

If it matters in tech, it&#39;s in TLDR. That&#39;s what makes TLDR the best place to find what you need to learn.



💪Team: Our 29-person full-time team includes alumni of TikTok, Reddit, Amazon, Business Insider, Asana, Morning Brew, and Pinterest. We&#39;ve stayed intentionally small, which means every person here owns a function rather than a slice of one.


📈Traction: We&#39;re bootstrapped, profitable, and on track for $35M in revenue this year - after $9M in 2024 and $20M in 2025. The advertisers who fund it want tech&#39;s decision-makers: AWS, Google Cloud, Anthropic, Slack, Notion, and GitHub.




ABOUT THE ROLE

The Go-to-Market Engineer owns TLDR&#39;s GTM systems end-to-end: the input and interface layer where our team interacts with the revenue stack. This is a building role, not just maintenance - you&#39;ll decide what&#39;s worth quick-fixing, automating, or re-architecting, and bring an AI-first lens to problems RevOps teams have historically solved by hand. The role sits inside Applied AI, giving you real autonomy over a revenue-critical domain and a seat close to how TLDR builds AI into its GTM systems, work that directly supports our ~$35M FY26 revenue target.

In this role, you will:

 - Own GTM systems end-to-end: HubSpot administration, attribution, quota updates, new-product launches, quarter-over-quarter transitions, and CSAT plumbing.

 - Own data integrity: build pipelines right and keep fields accurate and flowing downstream.

 - Diagnose recurring problems, decide whether to quick-fix, automate, or re-architect, and build the fix.

 - Evaluate net-new systems (e.g., Sponsy alternatives) and recommend a path forward.

 - Bring an AI-first lens to classic RevOps problems like attribution, and partner with the Head of Applied AI on the broader AI × GTM operating model.
   
   


WHAT SUCCESS LOOKS LIKE

In your first 6 months:

 - You&#39;re the single accountable owner of the GTM systems ring, with the contractor-held work transitioned to you.

 - You&#39;ve built the data-integrity layer - dashboards on field completeness and pipeline health, with alerting on top so no one checks by hand.

 - You&#39;ve shipped your first wave of automations and agent workflows, each with monitoring attached.

 - You&#39;ve documented it - fix-it procedures good enough that a break doesn&#39;t require you.
   
   


ABOUT YOU

 - Main background: 4–6 years owning GTM systems at a B2B SaaS or B2B tech company - ideally from an early-stage (Series B–C) environment where you ran GTM systems end-to-end as a single owner

 - Primary skills: HubSpot ownership beyond admin; strong critical thinking and consultant-style communication; a product mindset for solution design balanced with pragmatic urgency; root-cause diagnosis paired with quick, clear proposals; hands-on data-integrity ownership (pipeline monitoring, field population, accuracy).

 - Secondary skills: Fluency in what AI-first GTM systems look like, applying AI to problems like attribution; familiarity with how APIs and integrations work.

 - Nice-to-haves: SQL
   
   


YOU’LL THRIVE HERE IF YOU…

 - Want full ownership of a revenue-critical domain, with real autonomy and accountability, not just a task list.

 - Are comfortable operating without a paved playbook, this role has more ambiguity than structure.

 - Want to sit inside an Applied AI/engineering-focused team rather than a traditional RevOps team, and help define what GTM systems look like in an AI-native org.
   
   


WHY YOU&#39;LL LOVE IT

🤑Compensation: $175,000 - $205,000 + annual company performance bonus

🌎Location: We&#39;re 100% remote across the US and Canada. Work where you want - our bands are set to tier-1 city rates wherever you live.

🤝Team Events: Biannual team offsites. Most recently we’ve gone to New Orleans, San Diego and Park City!

🏝️Time to Recharge: Flexible PTO. Most of the team takes 2–3 weeks a year, plus holidays.

🏥Health Benefits: Comprehensive medical, dental and vision benefits with a 100% paid option

📈401(k) Plan: Empower 401(k)

🍼Paid Parental Leave

💻Home Office Stipend: Whatever makes you productive - standing desk, second monitor, chair, walking pad.

🔰Learning &amp; Development Stipend: For anything that makes you better at your work, and for AI tools especially. Don&#39;t ration your tokens.



📥 If you&#39;re ready to make a tremendous impact at a bootstrapped and profitable startup, please apply. Please let us know if you need any accommodation during any part of the interview process.

s in TLDR. That's what makes TLDR the best place to find what you need to learn.</strong><br /><br /></p><p style=\"min-height:1.5em\"><strong>💪Team: </strong>Our 29-person full-time team includes alumni of TikTok, Reddit, Amazon, Business Insider, Asana, Morning Brew, and Pinterest. We've stayed intentionally small, which means every person here owns a function rather than a slice of one.<br /></p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>📈Traction: </strong>We're bootstrapped, profitable, and on track for $35M in revenue this year - after $9M in 2024 and $20M in 2025. The advertisers who fund it want tech's decision-makers: AWS, Google Cloud, Anthropic, Slack, Notion, and GitHub.<br /><br /></p><h1><strong><u>About the Role</u></strong></h1><p style=\"min-height:1.5em\">The Go-to-Market Engineer owns TLDR's GTM systems end-to-end: the input and interface layer where our team interacts with the revenue stack. This is a building role, not just maintenance - you'll decide what's worth quick-fixing, automating, or re-architecting, and bring an AI-first lens to problems RevOps teams have historically solved by hand. The role sits inside Applied AI, giving you real autonomy over a revenue-critical domain and a seat close to how TLDR builds AI into its GTM systems, work that directly supports our ~$35M FY26 revenue target.</p><p style=\"min-height:1.5em\"><strong>In this role, you will:</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Own GTM systems end-to-end: HubSpot administration, attribution, quota updates, new-product launches, quarter-over-quarter transitions, and CSAT plumbing.</p></li><li><p style=\"min-height:1.5em\">Own data integrity: build pipelines right and keep fields accurate and flowing downstream.</p></li><li><p style=\"min-height:1.5em\">Diagnose recurring problems, decide whether to quick-fix, automate, or re-architect, and build the fix.</p></li><li><p style=\"min-height:1.5em\">Evaluate net-new systems (e.g., Sponsy alternatives) and recommend a path forward.</p></li><li><p style=\"min-height:1.5em\">Bring an AI-first lens to classic RevOps problems like attribution, and partner with the Head of Applied AI on the broader AI × GTM operating model.<br /><br /></p></li></ul><h1><strong><u>What Success Looks Like</u></strong></h1><p style=\"min-height:1.5em\"><em>In your first 6 months:</em></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">You're the single accountable owner of the GTM systems ring, with the contractor-held work transitioned to you.</p></li><li><p style=\"min-height:1.5em\">You've built the data-integrity layer - dashboards on field completeness and pipeline health, with alerting on top so no one checks by hand.</p></li><li><p style=\"min-height:1.5em\">You've shipped your first wave of automations and agent workflows, each with monitoring attached.</p></li><li><p style=\"min-height:1.5em\">You've documented it - fix-it procedures good enough that a break doesn't require you.<br /><br /></p></li></ul><h1><strong><u>About You</u></strong></h1><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Main background:</strong> 4–6 years owning GTM systems at a B2B SaaS or B2B tech company - ideally from an early-stage (Series B–C) environment where you ran GTM systems end-to-end as a single owner</p></li><li><p style=\"min-height:1.5em\"><strong>Primary skills:</strong> HubSpot ownership beyond admin; strong critical thinking and consultant-style communication; a product mindset for solution design balanced with pragmatic urgency; root-cause diagnosis paired with quick, clear proposals; hands-on data-integrity ownership (pipeline monitoring, field population, accuracy).</p></li><li><p style=\"min-height:1.5em\"><strong>Secondary skills:</strong> Fluency in what AI-first GTM systems look like, applying AI to problems like attribution; familiarity with how APIs and integrations work.</p></li><li><p style=\"min-height:1.5em\"><strong>Nice-to-haves:</strong> SQL<br /><br /></p></li></ul><h1><strong><u>You’ll Thrive Here If You…</u></strong></h1><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Want full ownership of a revenue-critical domain, with real autonomy and accountability, not just a task list.</p></li><li><p style=\"min-height:1.5em\">Are comfortable operating without a paved playbook, this role has more ambiguity than structure.</p></li><li><p style=\"min-height:1.5em\">Want to sit inside an Applied AI/engineering-focused team rather than a traditional RevOps team, and help define what GTM systems look like in an AI-native org.<br /><br /></p></li></ul><h1><strong><u>Why You'll Love It</u></strong></h1><p style=\"min-height:1.5em\">🤑<strong>Compensation</strong>: $175,000 - $205,000 + annual company performance bonus</p><p style=\"min-height:1.5em\">🌎<strong>Location</strong>: We're 100% remote across the US and Canada. Work where you want - our bands are set to tier-1 city rates wherever you live.</p><p style=\"min-height:1.5em\">🤝<strong>Team Events</strong>: Biannual team offsites. Most recently we’ve gone to New Orleans, San Diego and Park City!</p><p style=\"min-height:1.5em\">🏝️<strong>Time to Recharge</strong>: Flexible PTO. Most of the team takes 2–3 weeks a year, plus holidays.</p><p style=\"min-height:1.5em\">🏥<strong>Health Benefits</strong>: Comprehensive medical, dental and vision benefits with a 100% paid option</p><p style=\"min-height:1.5em\">📈<strong>401(k) Plan</strong>: Empower 401(k)</p><p style=\"min-height:1.5em\">🍼<strong>Paid Parental Leave</strong></p><p style=\"min-height:1.5em\"><strong>💻Home Office Stipend: </strong>Whatever makes you productive - standing desk, second monitor, chair, walking pad.</p><p style=\"min-height:1.5em\">🔰<strong>Learning &amp; Development Stipend</strong>: For anything that makes you better at your work, and for AI tools especially. Don't ration your tokens.<br /><br /></p><p style=\"min-height
