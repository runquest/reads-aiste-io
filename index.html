---
layout: default
title: Reads
---
<p class="home-intro">A daily digest of newsletters, summarized and grouped by category.</p>

<div class="home-issue-list">
{% assign posts = site.posts | sort: "date" | reverse %}
{% for post in posts %}
  <a class="home-issue-row" href="{{ post.url | relative_url }}">
    <span class="home-issue-num">{{ forloop.index | prepend: "00" | slice: -2, 2 }}</span>
    <span class="home-issue-title">{{ post.title }}</span>
  </a>
{% endfor %}
</div>
